function depth(i){const side=[1,3,5,7,9,11,13,15].includes(i)?-.09:[2,4,6,8,10,12,14,16].includes(i)?.09:0;return side+(i>=11?.03:0)}
function rotateX(p,a){const y=p[1],z=p[2];p[1]=y*Math.cos(a)-z*Math.sin(a);p[2]=y*Math.sin(a)+z*Math.cos(a)}
function rotateBoneX(pts,a,b,r){const y=pts[b][1]-pts[a][1],z=pts[b][2]-pts[a][2];pts[b][1]=pts[a][1]+y*Math.cos(r)-z*Math.sin(r);pts[b][2]=pts[a][2]+y*Math.sin(r)+z*Math.cos(r)}
function rotateChainY(pts,a,ids,r){for(const i of ids){const x=pts[i][0]-pts[a][0],z=pts[i][2]-pts[a][2];pts[i][0]=pts[a][0]+x*Math.cos(r)+z*Math.sin(r);pts[i][2]=pts[a][2]-x*Math.sin(r)+z*Math.cos(r)}}
function project(pts,s){const yaw=((s.yaw||0)+(s.bodyYaw||0))*Math.PI/180,pitch=(s.pitch||0)*Math.PI/180,roll=(s.roll||0)*Math.PI/180,dist=3.5*(s.distance||1),f=2.65*(s.focal||1);return pts.map(p=>{let[x,y,z,c]=p;[x,z]=[x*Math.cos(yaw)+z*Math.sin(yaw),-x*Math.sin(yaw)+z*Math.cos(yaw)];[y,z]=[y*Math.cos(pitch)-z*Math.sin(pitch),y*Math.sin(pitch)+z*Math.cos(pitch)];[x,y]=[x*Math.cos(roll)-y*Math.sin(roll),x*Math.sin(roll)+y*Math.cos(roll)];const q=f/(dist+z);return[x*q+(s.cropX||0),y*q+(s.cropY||0),c]})}
function fitView(input,s){let left=Infinity,right=-Infinity,foot=Infinity,top=-Infinity;for(let i=0;i<=40;i++){const t=i/40,frame=pseudo3D(sample(input.frames,t,s),s,t),valid=frame.filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])&&p[2]>.12),feet=[frame[15],frame[16]].filter(p=>p&&Number.isFinite(p[1]));for(const p of valid){left=Math.min(left,p[0]);right=Math.max(right,p[0]);top=Math.max(top,p[1])}foot=Math.min(foot,...feet.map(p=>p[1]),0)}return{center:(left+right)/2,foot,scale:Math.min(126,234/Math.max(top-foot,.1),436/Math.max(right-left,.1))}}
function draw(ctx,frame,view){const W=ctx.canvas.width,H=ctx.canvas.height,ground=H-18;ctx.fillStyle='#0F1720';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#273542';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(22,ground);ctx.lineTo(W-22,ground);ctx.stroke();const valid=frame.filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])&&p[2]>.12),map=p=>[W/2+(p[0]-view.center)*view.scale,ground-(p[1]-view.foot)*view.scale];ctx.strokeStyle='#D9E2EC';ctx.lineWidth=3.2;ctx.lineCap='round';ctx.lineJoin='round';for(const[a,b]of BONES)if(frame[a][2]>.12&&frame[b][2]>.12){const A=map(frame[a]),B=map(frame[b]);ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.stroke()}ctx.fillStyle='#F8FAFC';for(const p of valid){const q=map(p);ctx.beginPath();ctx.arc(q[0],q[1],3.7,0,Math.PI*2);ctx.fill()}}
function mid(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2,Math.min(a[3],b[3])]}
const params=new URLSearchParams(location.search),requestedTitles=params.getAll('title'),requestedCount=Math.max(1,Number(params.get('count'))||INPUT_COUNT),view=renderPoseSessions({count:requestedCount,titles:requestedTitles.length?requestedTitles:INPUT_TITLES,pose:INPUT_POSE});let playing=true,start=performance.now(),pausedAt=0;
function tick(now){if(playing){view.sessions.forEach((s,i)=>{const elapsed=(now-start)/1000,local=Math.max(0,elapsed-s.start),t=(local%s.duration)/s.duration,warped=phaseWarp(t,s),frame=sample(INPUT_POSE.frames,warped,s);draw(view.canvases[i].getContext('2d'),pseudo3D(frame,s,warped),s.view)});document.getElementById('status').textContent=`${INPUT_POSE.frames.length} frames · shared bones · pseudo-3D projection`}requestAnimationFrame(tick)}requestAnimationFrame(tick);

window.renderPoseSessions=renderPoseSessions;
