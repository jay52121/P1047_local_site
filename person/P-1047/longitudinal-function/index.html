<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#172235;--muted:#7a8798;--line:#e5e9ef;
  --blue:#2f6fe4;--blue2:#8ea9db;--green:#16845b;--greenBg:#eaf8f2;
  --red:#cf4c4c;--redBg:#fff0ef;--amber:#c77a19;--amberBg:#fff6e7;
  --shadow:0 15px 36px rgba(28,40,65,.08)
}
*{box-sizing:border-box}
body{margin:0;min-width:1180px;background:linear-gradient(180deg,#f8f9fb,#f2f4f7);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;color:var(--ink)}
button,select{font:inherit}
.app{max-width:1680px;margin:0 auto;padding:18px 26px 42px}
.pageHead{display:flex;align-items:flex-end;justify-content:space-between;margin:3px 2px 16px}
.pageHead h1{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:820;color:var(--blue)}
.pageHead p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.status{font-size:11px;color:#5c6d83;padding:6px 9px;border:1px solid #dde4ee;background:#f8fafc;border-radius:999px}
.shell{display:grid;grid-template-columns:190px 1fr;gap:16px}
.sidebar,.panel{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}
.sidebar{padding:14px;align-self:start;position:sticky;top:66px}
.sideTitle{font-size:11px;color:#8b96a6;font-weight:800;letter-spacing:.08em;margin:3px 6px 10px}
.place{padding:11px 12px;border-radius:11px;cursor:pointer;margin:4px 0;display:flex;align-items:center;gap:9px;color:#56657a;font-size:13px;font-weight:700;border:1px solid transparent}
.place:hover{background:#f6f8fb} .place.active{background:#16223a;color:#fff}
.placeDot{width:8px;height:8px;border-radius:50%;background:#b9c3d1} .place.active .placeDot{background:#7eacff}
.sideNote{font-size:10px;line-height:1.65;color:#8d98a7;border-top:1px solid #edf0f4;margin-top:12px;padding:12px 6px 2px}
.main{min-width:0}
.hero{padding:16px 18px;margin-bottom:14px}
.heroRow{display:grid;grid-template-columns:1fr 44px 1fr;gap:11px;align-items:stretch}
.weekBox{background:#fbfcfe;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.weekLabel{font-size:10px;color:#8995a5;font-weight:800;letter-spacing:.07em;margin-bottom:6px}
.weekSelect{width:100%;border:0;outline:0;background:transparent;color:#17263b;font-size:17px;font-weight:800;padding:0 0 4px}
.weekMeta{display:flex;gap:10px;flex-wrap:wrap;color:#7d8999;font-size:10px;margin-top:6px}
.vs{display:grid;place-items:center;font-size:10px;color:#9da7b5;font-weight:900}

.summaryText{font-size:12px;color:#627187} .summaryText b{color:#20314c}
.summaryPills{display:flex;gap:7px} .pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px}
.pill.good{color:var(--green);background:var(--greenBg)} .pill.bad{color:var(--red);background:var(--redBg)} .pill.neutral{color:#667589;background:#eef2f6}
.metricGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin-bottom:14px}
.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 8px 20px rgba(31,45,73,.045);cursor:pointer;transition:.16s;min-height:142px;overflow:hidden}
.metric:hover{transform:translateY(-2px);box-shadow:0 13px 28px rgba(31,45,73,.085)} .metric.selected{border-color:#9db9fb;box-shadow:0 0 0 2px #e5edff inset,0 13px 28px rgba(47,111,228,.10)}
.metricLabel{font-size:12px;color:#6d7a8d;font-weight:750}
.metricValue{font-size:31px;line-height:1;font-weight:850;letter-spacing:-.04em;margin:13px 0 5px}
.metricValue small{font-size:12px;color:#99a4b3;font-weight:650;margin-left:3px}
.metricDelta{font-size:11px;font-weight:820} .metricDelta.good{color:var(--green)} .metricDelta.bad{color:var(--red)} .metricDelta.neutral{color:#69778a}
.spark{height:35px;margin-top:8px}
.contentGrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px}
.chartPanel{padding:15px 17px 12px;min-height:455px}
.panelHeader{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.panelTitle{font-size:15px;font-weight:820} .panelSub{font-size:10px;color:#8c98a8;margin-top:4px}

.detailPanel{padding:15px}

.evidence{padding:10px 0;border-top:1px solid #edf0f4} .evidence:first-of-type{border-top:0}
.evRow{display:flex;justify-content:space-between;align-items:flex-start;gap:11px} .evName{font-size:11px;color:#45546a;font-weight:720} .evVals{font-size:11px;color:#56657a;text-align:right;font-variant-numeric:tabular-nums}

.secondaryTitle{font-size:10px;color:#8994a5;font-weight:800;letter-spacing:.07em;margin-top:12px;padding-top:11px;border-top:1px solid #edf0f4}
.secondaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px} .secondaryItem{background:#fafbfd;border:1px solid #e8edf3;border-radius:9px;padding:8px}

.noteBox{margin-top:11px;padding:9px 10px;background:#f6f8fb;border-radius:10px;color:#667589;font-size:10px;line-height:1.65}
.emptyState{min-height:420px;display:grid;place-items:center;color:#7a8798;font-size:15px;font-weight:700}

  ['位置 A · 动作流畅度','位置A_动作流畅度_0_100','',true]],
 walk:[
  ['位置 B · 归一化移动速度','位置B_归一化移动速度_BL_s',' BL/s',true],
  ['位置 B · 180°转身时间','位置B_180度转身时间_s','s',false],
  ['位置 B · 移动停顿率','位置B_移动停顿率_%','%',false],
  ['位置 D · 单步时间','位置D_单步时间_s','s',false]],
 balance:[
  ['位置 A · 站起后稳定','位置A_站起后稳定_s','s',false],
  ['位置 C · 转身后稳定','位置C_转身后稳定_s','s',false],
  ['位置 C · 横向摆动','位置C_横向摆动_身高%','%',false],
  ['位置 C · 左右不对称','位置C_左右不对称_%','%',false]],
 strength:[
  ['位置 A · 主要发力阶段','位置A_主要发力阶段_s','s',false],
  ['膝伸展峰值速度','膝伸展峰值速度_deg_s','°/s',true],
  ['髋伸展峰值速度','髋伸展峰值速度_deg_s','°/s',true],
  ['位置 A · 手部支撑率','位置A_手部支撑率_%','%',false],
  ['位置 D · 单步时间','位置D_单步时间_s','s',false]],
 risk:[
  ['起居转移能力','起居转移能力相对指数','',true],
  ['行走移动能力','行走移动能力相对指数','',true],
  ['平衡稳定能力','平衡稳定能力相对指数','',true],
  ['下肢发力能力','下肢发力能力相对指数','',true],
  ['跨位置周内波动','跨位置周内波动_CV_%','%',false]]
};
const secondaryMap={
 transfer:[['膝关节运动表现','膝关节运动表现相对指数'],['髋关节运动表现','髋关节运动表现相对指数'],['动作协调性','动作协调性相对指数']],
 walk:[['左右对称性','左右对称性相对指数'],['动作协调性','动作协调性相对指数']],
 balance:[['左右对称性','左右对称性相对指数'],['动作协调性','动作协调性相对指数']],
 strength:[['膝关节运动表现','膝关节运动表现相对指数'],['髋关节运动表现','髋关节运动表现相对指数']],
 risk:[['膝关节运动表现','膝关节运动表现相对指数'],['髋关节运动表现','髋关节运动表现相对指数'],['左右对称性','左右对称性相对指数'],['动作协调性','动作协调性相对指数']]
};

function d(s){return new Date(s+'T00:00:00')}
function fmt(s){const x=d(s);return x.getFullYear()+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+String(x.getDate()).padStart(2,'0')}
function weekText(r){return fmt(r['周开始'])+' — '+fmt(r['周结束'])}
function startOfWeek(x){const y=new Date(x);const day=y.getDay()||7;y.setDate(y.getDate()-day+1);y.setHours(0,0,0,0);return y}
function weeksAgo(r){return Math.max(0,Math.round((startOfWeek(new Date())-startOfWeek(d(r['周开始'])))/604800000))}
function weekSelectText(r){const n=weeksAgo(r);return `${weekText(r)}（${n} week${n===1?'':'s'} ago）`}
function rel(l,r){return 100*r/l}
function classify(def,l,r){
 const q=r/l;
 if(def.risk){if(Math.abs(q-1)<.015)return ['稳定','neutral'];return q<1?['风险降低','good']:['风险增加','bad'];}
 if(Math.abs(q-1)<.015)return ['稳定','neutral'];
 return q>1?['改善','good']:['下降','bad'];
}
function delta(def,l,r){const p=(r/l-1)*100;return (p>=0?'+':'')+p.toFixed(1)+'%'}
function getClips(r){return r['有效片段数'] ?? r['有效样本数'] ?? 0}
function sparkSVG(data,field,li,ri,def){
 const vals=data.slice(li,ri+1).map(x=>rel(data[li][field],x[field]));
 const w=180,h=34,p=2; let mn=Math.min(...vals),mx=Math.max(...vals);if(mx-mn<1){mn-=.5;mx+=.5}
 const path=vals.map((v,i)=>`${i?'L':'M'}${p+i*(w-2*p)/Math.max(1,vals.length-1)},${p+(mx-v)*(h-2*p)/(mx-mn)}`).join(' ');
 const end=vals.at(-1); const cls=classify(def,100,end)[1]; const color=cls==='good'?'#1c8b62':cls==='bad'?'#d45454':'#8996a8';
 return `<svg viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.1" stroke-linecap="round"/><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#e9edf3"/></svg>`;
}
function render(){
 document.getElementById('main').innerHTML=`
 <section class="panel hero">
  <div class="heroRow">
   <div class="weekBox"><div class="weekLabel">历史周</div><select id="leftWeek" class="weekSelect"></select><div id="leftMeta" class="weekMeta"></div></div>
   <div class="vs">VS</div>
   <div class="weekBox"><div class="weekLabel">比较周</div><select id="rightWeek" class="weekSelect"></select><div id="rightMeta" class="weekMeta"></div></div>
  </div>
  <div class="summaryLine"><div class="summaryText"><b>综合生活能力</b> · 相对变化基于左侧所选周</div><div class="summaryPills" id="summaryPills"></div></div>
 </section>
 <div class="metricGrid" id="metricGrid"></div>
 <div class="contentGrid">
  <section class="panel chartPanel">
   <div class="panelHeader"><div><div class="panelTitle" id="chartTitle"></div><div class="panelSub" id="chartSub"></div></div>
    <div class="legend"><span><i style="background:#2f6fe4"></i>周基线</span><span><i style="background:#8ea9db"></i>4周趋势</span><span><i style="background:#ef9b3a"></i>事件</span></div></div>
   <div class="chartWrap"><svg id="chart"></svg></div><div class="phaseBar" id="phaseBar"></div>
  </section>
  <aside class="panel detailPanel"><div class="detailTitle" id="detailTitle"></div><div class="detailExplain" id="detailExplain"></div><div id="evidenceList"></div>
   <div class="noteBox">一级指数仅表达同一人的纵向相对变化。关节与运动学指标用于解释变化来源，不作为单次动作的临床绝对诊断。</div>
  </aside>
 </div>`;
 const L=document.getElementById('leftWeek'),R=document.getElementById('rightWeek');
 ROWS.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=weekSelectText(r);L.appendChild(o.cloneNode(true));R.appendChild(o)});
 L.value=19; R.value=39;
 L.onchange=()=>{if(+L.value>+R.value)R.value=L.value;update()};
 R.onchange=()=>{if(+R.value<+L.value)L.value=R.value;update()};
 update();
}
function update(){
 const li=+document.getElementById('leftWeek').value,ri=+document.getElementById('rightWeek').value,l=ROWS[li],r=ROWS[ri];
 document.getElementById('leftMeta').innerHTML=`<span>${getClips(l)} 条有效片段</span><span>可信度 ${(+l['基线可信度_%']).toFixed(1)}%</span><span>${l['周状态']}</span>`;
 document.getElementById('rightMeta').innerHTML=`<span>${getClips(r)} 条有效片段</span><span>可信度 ${(+r['基线可信度_%']).toFixed(1)}%</span><span>${r['周状态']}</span>`;
 let good=0,bad=0,stable=0;
 Object.values(metricDefs).forEach(def=>{const c=classify(def,l[def.field],r[def.field])[1];if(c==='good')good++;else if(c==='bad')bad++;else stable++;});
 document.getElementById('summaryPills').innerHTML=`<span class="pill good">${good} 项改善</span><span class="pill bad">${bad} 项下降</span><span class="pill neutral">${stable} 项稳定</span>`;
 document.getElementById('metricGrid').innerHTML=Object.entries(metricDefs).map(([k,def])=>{
   const rv=rel(l[def.field],r[def.field]); const [label,cls]=classify(def,l[def.field],r[def.field]);
   return `<div class="metric ${k===activeMetric?'selected':''}" data-key="${k}"><div class="metricLabel">${def.label}</div><div class="metricValue">${rv.toFixed(1)}<small>相对值</small></div><div class="metricDelta ${cls}">${delta(def,l[def.field],r[def.field])} · ${label}</div><div class="spark">${sparkSVG(ROWS,def.field,li,ri,def)}</div></div>`;
 }).join('');
 document.querySelectorAll('.metric').forEach(x=>x.onclick=()=>{activeMetric=x.dataset.key;update()});
 renderEvidence(l,r); renderChart(li,ri,l);
}
function renderEvidence(l,r){
 const def=metricDefs[activeMetric];
 document.getElementById('detailTitle').textContent=def.label+' · 变化依据';
 document.getElementById('detailExplain').textContent=def.desc;
 const ev=evidenceMap[activeMetric].map(([name,field,unit,higher])=>{
   const a=+l[field],b=+r[field],p=(b/a-1)*100;let cls='neutral',txt='稳定';
   if(higher===true){cls=p>1.5?'good':p<-1.5?'bad':'neutral';txt=cls==='good'?'改善':cls==='bad'?'下降':'稳定'}
   else{cls=p<-1.5?'good':p>1.5?'bad':'neutral';txt=cls==='good'?'改善':cls==='bad'?'下降':'稳定'}
   const dec=(unit==='%'||unit==='°/s'||unit===' BL/s')?1:2;const width=Math.min(100,Math.max(7,Math.abs(p)*3));
   return `<div class="evidence"><div class="evRow"><div class="evName">${name}</div><div><div class="evVals">${a.toFixed(dec)}${unit} → ${b.toFixed(dec)}${unit}</div><div class="evDelta ${cls}">${p>=0?'+':''}${p.toFixed(1)}% · ${txt}</div></div></div><div class="evBar"><span style="width:${width}%;background:${cls==='good'?'#1c8b62':cls==='bad'?'#d45454':'#c79a54'}"></span></div></div>`;
 }).join('');
 const sec=`<div class="secondaryTitle">二级人体功能拆解</div><div class="secondaryGrid">${secondaryMap[activeMetric].map(([name,field])=>{
   const rv=rel(l[field],r[field]),p=rv-100,cls=Math.abs(p)<1.5?'neutral':p>0?'good':'bad';
   return `<div class="secondaryItem"><div class="secondaryName">${name}</div><div class="secondaryValue">${rv.toFixed(1)}</div><div class="secondaryDelta ${cls}">${p>=0?'+':''}${p.toFixed(1)}%</div></div>`;
 }).join('')}</div>`;
 document.getElementById('evidenceList').innerHTML=ev+sec;
}
function renderChart(li,ri,l){
 const def=metricDefs[activeMetric],slice=ROWS.slice(li,ri+1),vals=slice.map(x=>rel(l[def.field],x[def.field]));
 const ma=vals.map((v,i)=>{let s=0,n=0;for(let j=Math.max(0,i-3);j<=i;j++){s+=vals[j];n++}return s/n});
 let mn=Math.min(...vals,...ma,96),mx=Math.max(...vals,...ma,104);let pad=(mx-mn)*.13||2;mn-=pad;mx+=pad;
 const W=900,H=290,L=48,R=18,T=17,B=38,x=i=>L+i*(W-L-R)/Math.max(1,slice.length-1),y=v=>T+(mx-v)*(H-T-B)/(mx-mn);
 let h=`<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d82eb" stop-opacity=".18"/><stop offset="1" stop-color="#4d82eb" stop-opacity="0"/></linearGradient></defs>`;
 [...new Set([mn,(mn+mx)/2,mx,100].map(v=>+v.toFixed(2)))].sort((a,b)=>a-b).forEach(v=>{h+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="${Math.abs(v-100)<.1?'#c8d2e2':'#edf0f4'}" stroke-dasharray="${Math.abs(v-100)<.1?'5 5':'0'}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#94a0b1">${v.toFixed(0)}</text>`});
 const p=vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' '),pm=ma.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ');
 h+=`<path d="M${x(0)},${y(vals[0])} ${p.slice(1)} L${x(vals.length-1)},${H-B} L${x(0)},${H-B} Z" fill="url(#area)"/><path d="${p}" fill="none" stroke="#2f6fe4" stroke-width="2.4" stroke-linecap="round"/><path d="${pm}" fill="none" stroke="#8ea9db" stroke-width="1.7" stroke-dasharray="6 5"/>`;
 slice.forEach((r,i)=>{if(r['事件标注'])h+=`<line x1="${x(i)}" y1="${T}" x2="${x(i)}" y2="${H-B}" stroke="#ef9b3a" stroke-dasharray="3 4" opacity=".65"/><circle cx="${x(i)}" cy="${T+7}" r="4" fill="#ef9b3a"><title>${r['事件标注']}</title></circle>`});
 vals.forEach((v,i)=>h+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.1" fill="#fff" stroke="#2f6fe4" stroke-width="2"><title>${weekText(slice[i])} · ${def.label} ${v.toFixed(1)}${slice[i]['事件标注']?' · '+slice[i]['事件标注']:''}</title></circle>`);
 const step=Math.max(1,Math.ceil(slice.length/6));for(let i=0;i<slice.length;i+=step)h+=`<text x="${x(i)}" y="${H-14}" text-anchor="middle" font-size="10" fill="#8e9aac">${fmt(slice[i]['周开始']).slice(2,7)}</text>`;
 const svg=document.getElementById('chart');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=h;
 document.getElementById('chartTitle').textContent=def.label+' · 长期变化曲线';
 document.getElementById('chartSub').textContent=`所选区间 ${slice.length} 周 · 相对左侧所选周 · 最低 ${Math.min(...vals).toFixed(1)} / 最高 ${Math.max(...vals).toFixed(1)} / 终点 ${vals.at(-1).toFixed(1)}`;
 const phases=[];slice.forEach(r=>{if(r['阶段解释']&&phases.at(-1)!==r['阶段解释'])phases.push(r['阶段解释'])});
 const events=slice.filter(r=>r['事件标注']).map(r=>fmt(r['周开始']).slice(5)+' · '+r['事件标注']);
 document.getElementById('phaseBar').innerHTML=phases.map(p=>`<span class="phaseChip">${p}</span>`).join('')+events.map(e=>`<span class="phaseChip event">${e}</span>`).join('');
}
document.querySelectorAll('.place').forEach(el=>el.onclick=()=>{
 document.querySelectorAll('.place').forEach(x=>x.classList.remove('active'));
 el.classList.add('active');activePlace=el.dataset.place;
 if(activePlace==='life')render();
 else document.getElementById('main').innerHTML='<section class="panel emptyState">选择的人物该数据为空</section>';
});
render();
</script>
</body></html>
